name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    name: Qt WebEngine / Debian Sid x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\(PlainwireDesktop VERSION ([0-9.]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match CMake version $version" >&2
            exit 1
          }

      - name: Source checks
        run: ./scripts/verify.sh

      - name: Build
        run: |
          mkdir -p "$PWD/out"
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            debian:sid-slim \
            bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential cmake ninja-build pkg-config \
                qt6-base-dev qt6-webengine-dev ca-certificates
              cmake -S . -B /tmp/plainwire-build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_SUPPRESS_REGENERATION=ON
              cmake --build /tmp/plainwire-build --parallel
              ctest --test-dir /tmp/plainwire-build --output-on-failure
              install -Dm755 /tmp/plainwire-build/plainwire-desktop /src/out/plainwire-desktop
              install -Dm644 packaging/me.kokonico.plainwire.desktop /src/out/me.kokonico.plainwire.desktop
              install -Dm644 resources/plainwire.png /src/out/plainwire.png
            '
          tar -C out -czf plainwire-desktop-debian-sid-amd64.tar.gz \
            plainwire-desktop me.kokonico.plainwire.desktop plainwire.png
          sha256sum plainwire-desktop-debian-sid-amd64.tar.gz > plainwire-desktop-debian-sid-amd64.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Plainwire Desktop $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            plainwire-desktop-debian-sid-amd64.tar.gz \
            plainwire-desktop-debian-sid-amd64.sha256
