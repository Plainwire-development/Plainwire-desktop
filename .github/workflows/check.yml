name: Check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  qt:
    name: Qt WebEngine / Debian Sid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source checks
        run: ./scripts/verify.sh

      - name: Compile with Debian Sid Qt
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            debian:sid-slim \
            bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential cmake ninja-build pkg-config \
                qt6-base-dev qt6-webengine-dev
              cmake -S . -B /tmp/plainwire-build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_SUPPRESS_REGENERATION=ON \
                -DCMAKE_CXX_FLAGS="-Werror"
              cmake --build /tmp/plainwire-build --parallel
              ctest --test-dir /tmp/plainwire-build --output-on-failure
            '
